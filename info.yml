# Metadata defining the behaviour and requirements for this app

# expected fields in the configuration file for this app
configuration:

    # tank write nodes paths
    write_nodes:
        type: list
        description: |
            List of configurations per "Profile". Each dictionary entry needs to include
            the keys defined in the below 'items' list. Note:

            - The render/publish templates fields need to include 'version' and can optionally include
              - 'name', 'width', 'height' (which reflect the image resolution of the render)
              - 'output' ("Output Name" value, which differentiates different write nodes).
              - If you are doing stereo rendering and want to use Nuke's %V flag, include an 'eye' field.
                This will be replaced by %V in the paths when the Flow Production Tracking Write node computes them.
            - The proxy templates must be defined, but if set to null, will fallback to using
              their respective regular render and publish templates.

            Optional configuration dictionary fields/keys which doesn't need to be defined:

            - 'ext_field': Name of the file extension (no dot) field in the templates to substitute
              with the 'file_type'. Defaults to "extension", a common alias used throughout
              tk-config-default2/core/templates.yml

        allows_empty: True
        values:
            type: dict
            items:
                name:
                    type: str
                    description:    "Name shown in the node's 'Profile' dropdown"
                file_type:
                    type: str
                    description:    "Nuke write node's file type to set (exr, cin, dpx etc)."
                settings:
                    type: dict
                    description:    "Nuke write node's knobs' names and value to set"
                tank_type:
                    type: tank_type
                    description:    "Name of Published File Type to use during publishing"
                render_template:
                    type: template
                    fields: context, version, SEQ, [channel], [output], [name], [width], [height], [eye], [YYYY], [MM], [DD], *
                    description:    "Template path to destination when rendered"
                publish_template:
                    type: template
                    fields: context, version, SEQ, [channel], [output], [name], [width], [height], [eye], [TankType], *
                    description:    "Template path to intended publish destination
                                     i.e. used by tk-multi-publish2"
                proxy_render_template:
                    type: template
                    fields: context, version, SEQ, [channel], [output], [name], [width], [height], [eye], *
                    description:    "Optional template path to render destination
                                     when 'Use Proxy' is ticked during rendering"

                    allows_empty: True
                    default_value: null
                proxy_publish_template:
                    type: template
                    fields: context, version, SEQ, [channel], [output], [name], [width], [height], [eye], [TankType], *
                    description:    "Optional template path to intended publish destination
                                     when 'Use Proxy' is ticked during rendering"
                    allows_empty: True
                    default_value: null
                tile_color:
                    type: list
                    values:
                        type: int
                    description:    "Specify a list of 3 values in the range 0-255 that represent the RGB values to be
                                     set for the node background/tile_color in the node graph when this profile is used.
                                     Specify an empty list to use the default colour."
                    allows_empty: True
                    default_value: []
                promote_write_knobs:
                    type: list
                    values:
                        type: str
                    description:    "Specify a list of knob names that should be promoted from the internal write node
                                     up to the user interface of the gizmo."
                    allows_empty: True
                    default_value: []

    # Note that if you have presets which promote write knobs, the convert menu items will not be shown, regardless
    # of the value applied to this setting, as at present the convert back method doesn't support promoted knobs.
    show_convert_actions:
        type: bool
        description: "Setting this to True will add actions for converting to and from Flow Production Tracking
                      write nodes. The actions will be displayed as options in the
                      Flow Production Tracking -> Context menu"
        default_value: False

    template_script_work:
        type: template
        description: "A reference to a template which locates a nuke script work file on disk. This
                     is used to drive the version and optionally the name of renders."
        fields: context, version, [name], *

# the Shotgun fields that this app needs in order to operate correctly
requires_shotgun_fields:

# More verbose description of this item
display_name: "Write Node"
description: "Support for the Flow Production Tracking Write Node in Nuke."

# Required minimum versions for this item to run
requires_shotgun_version:
requires_core_version: "v0.19.8"
minimum_python_version: "3.9"
requires_engine_version: "v0.2.3"

# the engines that this app can operate in:
supported_engines: [tk-nuke]

# the frameworks required to run this app
frameworks:
